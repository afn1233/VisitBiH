services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: visitbih
      POSTGRES_PASSWORD: visitbih
      POSTGRES_DB: visitbih
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitbih"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
